<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매출 관리 대시보드 - 커피 자판기</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --ink: #183027;
    --muted: #64736c;
    --paper: #f7f5ed;
    --panel: #fffdf6;
    --line: #d7dbcf;
    --green: #257357;
    --green-soft: #dff0e7;
    --orange: #dd7b35;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Apple SD Gothic Neo", Pretendard, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--paper) 0%, #f0ede3 100%);
    margin: 0;
    padding: 0;
    min-height: 100vh;
  }
  .header { background: linear-gradient(135deg, var(--green) 0%, #1a5f47 100%); color: white; padding: 24px 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 24px rgba(37, 115, 87, 0.15); position: relative; }
  .header h1 { margin: 0; font-size: 32px; font-weight: 700; color: white; position: absolute; left: 50%; transform: translateX(-50%); top: 0px; text-align: center; max-width: calc(100% - 160px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header p { margin: 0; opacity: 0.9; font-size: 14px; color: white; position: absolute; left: 50%; transform: translateX(-50%); top: 60px; text-align: center; max-width: calc(100% - 160px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .content-wrapper { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
  .content-wrapper h1 { font-size: 32px; margin: 0 0 4px; background: linear-gradient(135deg, var(--green) 0%, #1a5f47 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  h1 { font-size: 32px; margin: 0 0 4px; }
  p.lead { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .card {
    background: var(--panel);
    border: none;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 8px 32px rgba(24,48,39,.12);
    backdrop-filter: blur(10px);
  }

  /* 탭 */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    border-bottom: 2px solid var(--line);
    background: linear-gradient(90deg, transparent 0%, rgba(37, 115, 87, 0.03) 100%);
    padding-bottom: 12px;
  }
  .tab-btn {
    padding: 10px 18px;
    background: none;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
    border-bottom: 3px solid transparent;
    margin-bottom: -12px;
    transition: all 0.2s;
  }
  .tab-btn:hover {
    color: var(--green);
  }
  .tab-btn.active {
    color: var(--green);
    border-bottom-color: var(--green);
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeIn 0.3s; }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* 필터 */
  .filter { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-group { display: flex; flex-direction: column; gap: 6px; }
  .filter-group label { font-weight: 700; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .filter-group input {
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 13px;
    transition: all 0.2s;
  }
  .filter-group input:focus {
    outline: none;
    border-color: var(--green);
    background: var(--green-soft);
  }
  .filter-group button {
    padding: 10px 20px;
    background: linear-gradient(135deg, var(--green), #1a5f47);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(37, 115, 87, 0.2);
  }
  .filter-group button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(37, 115, 87, 0.3);
  }

  /* 요약 카드들 */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .stat-card {
    border: none;
    border-radius: 14px;
    padding: 24px;
    text-align: center;
    background: linear-gradient(135deg, var(--panel) 0%, rgba(255,255,255,0.8) 100%);
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(37, 115, 87, 0.1);
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--green) 0%, var(--orange) 100%);
  }
  .stat-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.15);
    border-color: var(--green);
  }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; font-weight: 700; margin-bottom: 12px; letter-spacing: 0.5px; }
  .stat-value { font-size: 36px; font-weight: 700; background: linear-gradient(135deg, var(--green), #1a5f47); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .stat-unit { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .stat-detail { font-size: 11px; color: #999; margin-top: 6px; }

  /* 테이블 */
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    padding: 14px;
    border-bottom: 2px solid var(--line);
    font-weight: 700;
    font-size: 12px;
    color: var(--ink);
    background: linear-gradient(135deg, rgba(37, 115, 87, 0.08), rgba(221, 123, 53, 0.08));
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  td {
    padding: 14px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  tbody tr {
    transition: all 0.2s;
  }
  tbody tr:hover {
    background-color: var(--green-soft);
    border-left: 3px solid var(--green);
    padding-left: 3px;
  }

  /* 상품/고객 목록 */
  .list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    margin-bottom: 10px;
    background: linear-gradient(135deg, rgba(37, 115, 87, 0.08), rgba(221, 123, 53, 0.06));
    border-radius: 10px;
    border: 1px solid rgba(37, 115, 87, 0.12);
    transition: all 0.25s;
    position: relative;
  }
  .list-item::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, var(--green), var(--orange));
    border-radius: 10px 0 0 10px;
    opacity: 0;
    transition: opacity 0.25s;
  }
  .list-item:last-child { margin-bottom: 0; }
  .list-item:hover {
    background: linear-gradient(135deg, rgba(37, 115, 87, 0.15), rgba(221, 123, 53, 0.12));
    transform: translateX(4px);
    border-color: var(--green);
  }
  .list-item:hover::before {
    opacity: 1;
  }
  .item-name { font-weight: 700; font-size: 14px; }
  .item-stat { color: var(--muted); font-size: 12px; font-weight: 500; }

  #loading { text-align: center; color: var(--muted); padding: 40px; }
  #error { color: #d97706; padding: 16px; background: #fef3c7; border-radius: 8px; }

  @media (max-width: 1200px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 768px) {
    .header {
      padding: 14px 10px;
    }
    .header h1 {
      font-size: 18px;
      max-width: calc(100% - 120px);
      top: 0px;
    }
    .header p {
      font-size: 10px;
      max-width: calc(100% - 120px);
      top: 52px;
    }
    .header a {
      font-size: 11px !important;
      padding: 6px 10px !important;
    }
    .tabs {
      gap: 6px;
      padding-bottom: 10px;
    }
    .tab-btn {
      padding: 10px 14px;
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .stats-grid { grid-template-columns: 1fr; }
    body { padding: 0 12px; }
  }

  @media (max-width: 480px) {
    .header {
      padding: 12px 8px;
    }
    .header h1 {
      font-size: 14px;
      max-width: 70%;
      top: 8px;
    }
    .header p {
      display: none;
    }
    .header a {
      font-size: 10px !important;
      padding: 4px 8px !important;
    }
    .tabs {
      gap: 4px;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }
    .tab-btn {
      padding: 8px 10px;
      font-size: 11px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-bottom: -8px;
    }
  }

  /* 강제 모바일 모드 */
  body.force-mobile {
    max-width: 480px;
    margin: 0 auto;
  }
  body.force-mobile .header {
    padding: 12px 8px;
  }
  body.force-mobile .header h1 {
    font-size: 16px;
    max-width: calc(100% - 100px);
    top: 0px;
  }
  body.force-mobile .header p {
    display: none;
  }
  body.force-mobile .header h1 {
    font-size: 14px;
    max-width: 70%;
    top: 8px;
  }
  body.force-mobile .tabs {
    gap: 4px;
    padding-bottom: 8px;
    margin-bottom: 16px;
  }
  body.force-mobile .tab-btn {
    padding: 8px 10px;
    font-size: 11px;
    white-space: nowrap;
    flex-shrink: 0;
    margin-bottom: -8px;
  }
  body.force-mobile .header a {
    font-size: 10px !important;
    padding: 4px 8px !important;
  }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>☕ 매출 관리 대시보드</h1>
    <p>커피 자판기 판매 현황을 한눈에 확인하세요.</p>
  </div>
  <a href="index.html" style="background: rgba(255, 255, 255, 0.2); padding: 10px 20px; border-radius: 8px; color: white; text-decoration: none; font-size: 14px; font-weight: 600; transition: all 0.2s; display: inline-block; white-space: nowrap;" onmouseover="this.style.background='rgba(255, 255, 255, 0.3)'; this.style.transform='translateY(-2px)'" onmouseout="this.style.background='rgba(255, 255, 255, 0.2)'; this.style.transform='translateY(0)'">⬅ 메인</a>
</div>

<div class="content-wrapper">
<!-- 탭 -->
<div class="tabs">
  <button class="tab-btn active" data-tab="dashboard">📊 대시보드</button>
  <button class="tab-btn" data-tab="daily">📈 일별 매출</button>
  <button class="tab-btn" data-tab="hourly">⏰ 시간별 매출</button>
  <button class="tab-btn" data-tab="transactions">📋 거래 내역</button>
</div>

<!-- 대시보드 탭 -->
<div id="dashboard" class="tab-content active card">
  <h2 style="margin: 0 0 16px; font-size: 18px;">📊 요약</h2>

  <div style="margin-bottom: 20px;">
    <label style="font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; display: block; margin-bottom: 8px;">기준 날짜 선택</label>
    <input type="date" id="summary-date-input" style="padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; width: 100%; max-width: 200px; cursor: pointer;" onchange="loadSummaryByDate()">
  </div>

  <div style="font-size: 12px; color: var(--muted); margin-bottom: 16px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; background: rgba(37, 115, 87, 0.05); padding: 12px; border-radius: 8px;">
    <div>📅 <strong id="summary-date">-</strong></div>
    <div>📆 이번 주: <span id="week-range">-</span></div>
    <div>📊 이번 달: <span id="month-range">-</span></div>
  </div>
  <div class="stats-grid" id="summary-stats">
    <div class="stat-card">
      <div class="stat-label">총 매출액</div>
      <div class="stat-value" id="total-revenue">-</div>
      <div class="stat-detail" id="total-detail">-</div>
      <div class="stat-detail" style="margin-top: 2px; font-size: 10px; color: #999;">전체 기간</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">오늘 매출</div>
      <div class="stat-value" id="today-revenue">-</div>
      <div class="stat-detail" id="today-detail">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">이번 주 매출</div>
      <div class="stat-value" id="week-revenue">-</div>
      <div class="stat-detail" id="week-detail">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">이번 달 매출</div>
      <div class="stat-value" id="month-revenue">-</div>
      <div class="stat-detail" id="month-detail">-</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
    <div>
      <h3 style="margin: 0 0 4px; font-size: 16px;">🔝 인기 상품 TOP 5</h3>
      <div style="font-size: 11px; color: var(--muted); margin-bottom: 12px;">전체 기간</div>
      <div id="top-products"></div>
    </div>
    <div>
      <h3 style="margin: 0 0 4px; font-size: 16px;">👥 단골 고객 TOP 5</h3>
      <div style="font-size: 11px; color: var(--muted); margin-bottom: 12px;">전체 기간</div>
      <div id="top-customers"></div>
    </div>
  </div>
</div>

<!-- 일별 매출 탭 -->
<div id="daily" class="tab-content card">
  <h2 style="margin: 0 0 16px; font-size: 18px;">📈 일별 매출</h2>
  <div class="filter">
    <div class="filter-group">
      <label>시작 날짜</label>
      <input type="date" id="daily-from">
    </div>
    <div class="filter-group">
      <label>종료 날짜</label>
      <input type="date" id="daily-to">
    </div>
    <div class="filter-group">
      <button onclick="loadDaily()">조회</button>
    </div>
  </div>
  <div id="daily-content">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;">
      <div>
        <h3 style="margin: 0 0 16px; font-size: 14px; font-weight: 700;">일별 매출 추이</h3>
        <canvas id="dailyRevenueChart" style="max-height: 250px;"></canvas>
      </div>
      <div>
        <h3 style="margin: 0 0 16px; font-size: 14px; font-weight: 700;">일별 거래 건수</h3>
        <canvas id="dailyTransactionChart" style="max-height: 250px;"></canvas>
      </div>
    </div>
    <div id="daily-table"></div>
  </div>
</div>

<!-- 시간별 매출 탭 -->
<div id="hourly" class="tab-content card">
  <h2 style="margin: 0 0 16px; font-size: 18px;">⏰ 시간별 매출</h2>
  <div class="filter">
    <div class="filter-group">
      <label>시작 날짜</label>
      <input type="date" id="hourly-from">
    </div>
    <div class="filter-group">
      <label>종료 날짜</label>
      <input type="date" id="hourly-to">
    </div>
    <div class="filter-group">
      <button onclick="loadHourly()">조회</button>
    </div>
  </div>
  <div id="hourly-content">
    <div style="margin-bottom: 24px;">
      <h3 style="margin: 0 0 16px; font-size: 14px; font-weight: 700;">시간별 판매량 및 매출</h3>
      <canvas id="hourlyChart" style="max-height: 300px;"></canvas>
    </div>
    <div id="hourly-table"></div>
  </div>
</div>

<!-- 거래 내역 탭 -->
<div id="transactions" class="tab-content card">
  <h2 style="margin: 0 0 16px; font-size: 18px;">📋 거래 내역</h2>
  <div class="filter">
    <div class="filter-group">
      <label>시작 날짜</label>
      <input type="date" id="trans-from">
    </div>
    <div class="filter-group">
      <label>종료 날짜</label>
      <input type="date" id="trans-to">
    </div>
    <div class="filter-group">
      <button onclick="loadTransactions()">조회</button>
    </div>
  </div>
  <div id="transactions-content"></div>
</div>

<div id="error"></div>

<script>
// 날짜 포맷팅
function formatPrice(price) {
  return price.toLocaleString("ko-KR") + " 원";
}

function formatDate(iso) {
  return new Date(iso).toLocaleString("ko-KR", {
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit"
  });
}

function formatDateOnly(iso) {
  return iso.split("T")[0];
}

// 탭 전환
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", (e) => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
    e.target.classList.add("active");
    document.getElementById(e.target.dataset.tab).classList.add("active");
  });
});

// 오늘 날짜를 기본값으로
function setDefaultDates() {
  const today = new Date().toISOString().split("T")[0];
  const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString().split("T")[0];

  document.getElementById("daily-from").value = thirtyDaysAgo;
  document.getElementById("daily-to").value = today;
  document.getElementById("hourly-from").value = today;
  document.getElementById("hourly-to").value = today;
  document.getElementById("trans-from").value = thirtyDaysAgo;
  document.getElementById("trans-to").value = today;
}

// 날짜 선택 시 요약 로드
function loadSummaryByDate() {
  const dateInput = document.getElementById("summary-date-input").value;
  loadSummary(dateInput);
}

// 대시보드 로드
async function loadSummary(date) {
  try {
    const url = date ? `/api/sales?mode=summary&date=${date}` : "/api/sales?mode=summary";
    const res = await fetch(url);
    if (!res.ok) throw new Error("응답 실패");

    const data = await res.json();

    // 날짜 범위 표시
    document.getElementById("summary-date").textContent = data.today;
    document.getElementById("week-range").textContent = data.weekStart + " ~ " + data.weekEnd;
    document.getElementById("month-range").textContent = data.monthStart + " ~ " + data.monthEnd;
    document.getElementById("summary-date-input").value = data.today;

    // 총 매출액 & 수량
    document.getElementById("total-revenue").textContent = formatPrice(data.totalRevenue);
    document.getElementById("total-detail").textContent = `${data.totalTransactions}건 · ${data.totalQuantity}개 팔림`;

    // 오늘 매출
    document.getElementById("today-revenue").textContent = formatPrice(data.todayRevenue);
    document.getElementById("today-detail").textContent = `${data.todayTransactions}건 · ${data.todayQuantity}개`;

    // 이번 주 매출
    document.getElementById("week-revenue").textContent = formatPrice(data.weekRevenue);
    document.getElementById("week-detail").textContent = `${data.weekTransactions}건 · ${data.weekQuantity}개`;

    // 이번 달 매출
    document.getElementById("month-revenue").textContent = formatPrice(data.monthRevenue);
    document.getElementById("month-detail").textContent = `${data.monthTransactions}건 · ${data.monthQuantity}개`;

    // TOP 상품
    const productsHtml = data.topProducts.map((p, i) => `
      <div class="list-item">
        <span class="item-name">${i + 1}. ${p.name}</span>
        <span class="item-stat">${p.quantity}잔 · ${formatPrice(p.revenue)}</span>
      </div>
    `).join("");
    document.getElementById("top-products").innerHTML = productsHtml || "<p style='color: var(--muted);'>데이터 없음</p>";

    // TOP 고객
    const customersHtml = data.topCustomers.map((c, i) => `
      <div class="list-item">
        <span class="item-name">${i + 1}. ${c.name}</span>
        <span class="item-stat">${c.count}회 · ${formatPrice(c.total)}</span>
      </div>
    `).join("");
    document.getElementById("top-customers").innerHTML = customersHtml || "<p style='color: var(--muted);'>데이터 없음</p>";
  } catch (e) {
    document.getElementById("error").textContent = "오류: " + e.message;
  }
}

// 일별 매출 로드
async function loadDaily() {
  const from = document.getElementById("daily-from").value;
  const to = document.getElementById("daily-to").value;

  if (!from || !to) {
    alert("날짜를 선택하세요");
    return;
  }

  document.getElementById("daily-content").innerHTML = "<div id='loading'>로딩 중...</div>";

  try {
    const res = await fetch(`/api/sales?mode=daily&from=${from}&to=${to}`);
    if (!res.ok) throw new Error("응답 실패");

    const data = await res.json();
    if (data.length === 0) {
      document.getElementById("daily-content").innerHTML = "<p style='color: var(--muted);'>데이터 없음</p>";
      return;
    }

    // 차트 데이터 준비
    const dates = data.map(d => d.date);
    const revenues = data.map(d => d.revenue);
    const transactions = data.map(d => d.transactions);

    const chartHtml = `
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;">
        <div>
          <h3 style="margin: 0 0 16px; font-size: 14px; font-weight: 700;">일별 매출 추이</h3>
          <canvas id="dailyRevenueChart"></canvas>
        </div>
        <div>
          <h3 style="margin: 0 0 16px; font-size: 14px; font-weight: 700;">일별 거래 건수</h3>
          <canvas id="dailyTransactionChart"></canvas>
        </div>
      </div>
      <div id="daily-table">
        <table>
          <thead>
            <tr>
              <th>날짜</th>
              <th>거래 건수</th>
              <th>일 매출액</th>
              <th>상품별 판매량</th>
            </tr>
          </thead>
          <tbody>
            ${data.map(d => `
              <tr>
                <td>${d.date}</td>
                <td>${d.transactions}건</td>
                <td style="font-weight: 700; color: var(--green);">${formatPrice(d.revenue)}</td>
                <td style="font-size: 12px; color: var(--muted);">
                  ${Object.entries(d.products).map(([p, q]) => `${p}: ${q}잔`).join(" · ")}
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;
    document.getElementById("daily-content").innerHTML = chartHtml;

    // 차트 그리기
    setTimeout(() => {
      drawDailyChart(dates, revenues, transactions);
    }, 100);
  } catch (e) {
    document.getElementById("error").textContent = "오류: " + e.message;
  }
}

function drawDailyChart(dates, revenues, transactions) {
  const revenueCtx = document.getElementById("dailyRevenueChart");
  const transactionCtx = document.getElementById("dailyTransactionChart");

  new Chart(revenueCtx, {
    type: 'line',
    data: {
      labels: dates,
      datasets: [{
        label: '매출액 (원)',
        data: revenues,
        borderColor: '#257357',
        backgroundColor: 'rgba(37, 115, 87, 0.1)',
        tension: 0.3,
        fill: true,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: { legend: { display: false } }
    }
  });

  new Chart(transactionCtx, {
    type: 'bar',
    data: {
      labels: dates,
      datasets: [{
        label: '거래 건수',
        data: transactions,
        backgroundColor: '#dd7b35',
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: { legend: { display: false } }
    }
  });
}

// 시간별 매출 로드
async function loadHourly() {
  const from = document.getElementById("hourly-from").value;
  const to = document.getElementById("hourly-to").value;

  if (!from || !to) {
    alert("날짜를 선택하세요");
    return;
  }

  document.getElementById("hourly-content").innerHTML = "<div id='loading'>로딩 중...</div>";

  try {
    const res = await fetch(`/api/sales?mode=hourly&from=${from}&to=${to}`);
    if (!res.ok) throw new Error("응답 실패");

    const data = await res.json();

    // 차트 데이터 준비
    const hours = data.map(d => d.hour);
    const quantities = data.map(d => d.quantity);
    const revenues = data.map(d => d.revenue);

    const chartHtml = `
      <div style="margin-bottom: 24px;">
        <h3 style="margin: 0 0 16px; font-size: 14px; font-weight: 700;">시간별 판매량 및 매출</h3>
        <canvas id="hourlyChart"></canvas>
      </div>
      <div id="hourly-table">
        <table>
          <thead>
            <tr>
              <th>시간</th>
              <th>거래 건수</th>
              <th>판매량</th>
              <th>시간별 매출</th>
            </tr>
          </thead>
          <tbody>
            ${data.map(d => `
              <tr>
                <td>${d.hour}</td>
                <td>${d.transactions}건</td>
                <td>${d.quantity}개</td>
                <td style="font-weight: 700; color: var(--green);">${formatPrice(d.revenue)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;
    document.getElementById("hourly-content").innerHTML = chartHtml;

    // 차트 그리기
    setTimeout(() => {
      drawHourlyChart(hours, quantities, revenues);
    }, 100);
  } catch (e) {
    document.getElementById("error").textContent = "오류: " + e.message;
  }
}

function drawHourlyChart(hours, quantities, revenues) {
  const ctx = document.getElementById("hourlyChart");

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: hours,
      datasets: [
        {
          label: '판매량 (개)',
          data: quantities,
          backgroundColor: '#257357',
          yAxisID: 'y',
        },
        {
          label: '매출액 (원)',
          data: revenues,
          backgroundColor: '#dd7b35',
          yAxisID: 'y1',
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      scales: {
        y: { type: 'linear', position: 'left' },
        y1: { type: 'linear', position: 'right', grid: { drawOnChartArea: false } }
      }
    }
  });
}

// 거래 내역 로드
async function loadTransactions() {
  const from = document.getElementById("trans-from").value;
  const to = document.getElementById("trans-to").value;

  if (!from || !to) {
    alert("날짜를 선택하세요");
    return;
  }

  document.getElementById("transactions-content").innerHTML = "<div id='loading'>로딩 중...</div>";

  try {
    const res = await fetch(`/api/sales?mode=transactions&from=${from}&to=${to}`);
    if (!res.ok) throw new Error("응답 실패");

    const data = await res.json();
    if (data.length === 0) {
      document.getElementById("transactions-content").innerHTML = "<p style='color: var(--muted);'>데이터 없음</p>";
      return;
    }

    const html = `
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>구매자</th>
            <th>상품</th>
            <th>수량</th>
            <th>단가</th>
            <th>총액</th>
            <th>시간</th>
          </tr>
        </thead>
        <tbody>
          ${data.map(t => `
            <tr>
              <td>${t.id}</td>
              <td>${t.buyer_name}</td>
              <td>${t.product}</td>
              <td>${t.quantity}잔</td>
              <td>${formatPrice(t.price_per_unit)}</td>
              <td style="font-weight: 700; color: var(--green);">${formatPrice(t.total_price)}</td>
              <td style="font-size: 12px; color: var(--muted);">${formatDate(t.purchased_at)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
    document.getElementById("transactions-content").innerHTML = html;
  } catch (e) {
    document.getElementById("error").textContent = "오류: " + e.message;
  }
}

// 페이지 로드
setDefaultDates();
const today = new Date().toISOString().split("T")[0];
document.getElementById("summary-date-input").value = today;
loadSummary(today);
loadDaily();
loadHourly();
</script>
